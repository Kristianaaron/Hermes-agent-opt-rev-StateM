model:
  default: deepseek-v4-flash-0731
  max_tokens: 16384
  context_length: 262144
  provider: deepseek-v4-flash
  base_url: ${DEEPSEEK_V4_FLASH_BASE_URL}
  key_env: DEEPSEEK_V4_FLASH_API_KEY
providers:
  glm-5.3-flash:
    name: GLM-5.3 Flash (OpenAI-compatible Spark/vLLM)
    base_url: ${GLM_FLASH_BASE_URL}
    model: glm-5.3-flash-exl3-dspark
    discover_models: false
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
        reasoning_effort: low
        clear_thinking: true
    models:
      glm-5.3-flash-exl3-dspark:
        context_length: 1048576
        stale_timeout_seconds: 21600
        timeout_seconds: 21600
    key_env: GLM_FLASH_API_KEY
  deepseek-v4-flash:
    name: DeepSeek V4 Flash 0731
    base_url: ${DEEPSEEK_V4_FLASH_BASE_URL}
    model: deepseek-v4-flash-0731
    discover_models: true
    models:
      deepseek-v4-flash-0731:
        stale_timeout_seconds: 120
        timeout_seconds: 120
    key_env: DEEPSEEK_V4_FLASH_API_KEY
  openrouter:
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    model: stealth/ox-alpha
    discover_models: true
    models:
      stealth/ox-alpha:
        context_length: 1048576
        timeout_seconds: 180
    key_env: OPENROUTER_API_KEY
toolsets:
  computer_use:
    enabled: false
  browser:
    enabled: false
checkpoints:
  enabled: true
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
database:
  journal_mode: wal
agent:
  max_turns: 96
  api_max_retries: 2
  verify_on_stop: auto
  frontier_harness:
    enabled: true
    # Apply the provider-neutral execution protocol to chat-capable models.
    # DeepSeek-only wire behavior remains isolated in the transport layer.
    model_patterns: []
    exclude_patterns:
      - embedding
      - rerank
    inject_protocol: true
    persist_trajectory: true
    recent_tool_pairs: 5
    max_candidates: 2
    max_repairs_per_failure: 2
    escalate_after_failures: 2
    path_deviation_failure_streak: 2
    max_unproductive_actions: 4
    reasoning_budgets:
      localize: 768
      plan: 1280
      execute: 512
      verify: 768
      repair: 1280
      final: 768
      escalate: 2048
  execution_governor:
    enabled: true
    protected_path_patterns:
      - /operator/approve.txt
  tool_loop_guardrails:
    warnings_enabled: true
    hard_stop_enabled: true
    cross_turn_identical_block_after: 3
    max_consecutive_read_only: 12
    max_tool_only_iterations: 4
    work_tool_only_halt_after: 24
    housekeeping_tool_only_halt_after: 2
    commentary_gate_after: 2
    stale_anchor_block_after: 1
    ping_max_tool_only: 0
    warn_after:
      exact_failure: 2
      same_tool_failure: 2
      idempotent_no_progress: 2
    hard_stop_after:
      exact_failure: 2
      same_tool_failure: 6
      idempotent_no_progress: 3
    loop_caps:
      max_web_searches: 8
      max_subagents: 4
  disabled_toolsets: []
  verbose: false
  reasoning_effort: max
  reasoning_overrides:
    glm-5.3-flash-exl3-dspark: low
  system_prompt: 'TOOL EXECUTION POLICY:

    - Emit native tool arguments directly. Never wrap them inside an "arguments" field.

    - Check every required field against the tool schema before calling it.

    - Batch independent read-only inspections; do not split each file or status check
    into a separate turn.

    - After a tool error, diagnose the returned evidence once. Never repeat an unchanged
    failed call.

    - Prefer Hermes file tools for file edits. Do not build temporary rewrite scripts
    when patch or write_file can express the edit safely.

    - For background work, use the terminal tool''s background parameter; never add
    &, nohup, disown, or setsid to the shell command.

    - For the two-Spark DeepSeek host, use the configured SSH host alias ${DEEPSEEK_SSH_HOST_ALIAS}.
    Do not reconstruct identity-file paths.

    - Stop exploring once sufficient evidence is available. Summarize the result or
    state the specific blocker.

    STATEFUL EXECUTION POLICY:

    - Route greetings and simple answers directly. Use compact StateM for small implementation
    tasks and full StateM for risky, ambiguous, multi-file, or long-running tasks.

    - Treat transitions as fail-closed contracts. Record evidence and pass registered
    checks before advancing.

    - Separate exploration, planning, execution, independent verification, repair,
    and handoff.

    - Keep context bounded: durable facts belong in StateM artifacts; active context
    contains the task contract, current phase packet, and recent evidence.

    - Classify malformed calls, timeouts, 502s, unavailable environments, failed verification,
    and no-progress loops before recovery.

    - Pause, stop, and interrupt are authoritative until the user explicitly resumes.

    - Never reveal private chain-of-thought; show concise phase status, evidence,
    decisions, and next action.

    '
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
